name: Swift CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  quality:
    name: Fast Offline Quality Checks
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate YAML Files
        run: |
          ruby -ryaml -e '
            Dir.glob(".github/**/*.{yml,yaml}").each do |f|
              YAML.safe_load(File.read(f))
              puts "Validated: #{f}"
            end
          '

      - name: Verify Lowercase Filenames
        run: |
          if git ls-files | grep -v '^CNAME$' | grep '[A-Z]'; then
            echo "Error: uppercase tracked files found"
            exit 1
          fi
          echo "All tracked files are lowercase."

      - name: Verify Commit Message Conventions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -c '
          import subprocess, re, os
          pattern = re.compile(r"^[a-z]+: [a-z0-9]+ [a-z0-9]+ [a-z0-9]+$")
          base_sha = os.environ.get("BASE_SHA", "")

          if base_sha and not re.match(r"^0+$", base_sha):
              rev_range = f"{base_sha}..HEAD"
          else:
              rev_range = "HEAD~1..HEAD"

          try:
              commits = subprocess.check_output(["git", "log", rev_range, "--format=%H %s"]).decode().strip().split("\n")
          except Exception:
              commits = subprocess.check_output(["git", "log", "-1", "--format=%H %s"]).decode().strip().split("\n")

          commits = [c for c in commits if c.strip()]
          for c in commits:
              sha, msg = c.split(" ", 1)
              if msg.startswith("Merge "):
                  continue
              if not pattern.match(msg):
                  raise SystemExit(f"Invalid commit message {sha[:7]}: {msg}")
          print(f"Validated {len(commits)} commit messages.")
          '

  build-and-test:
    name: Build & Test macOS Application
    runs-on: macos-14
    needs: [ quality ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Run Tests
      run: |
        set -o pipefail
        swift test --verbose 2>&1 | tee swift-test.log

    - name: Emit Failure Diagnostics
      if: failure()
      run: |
        if [ -f swift-test.log ]; then
          echo "::error title=swift test tail::$(tail -c 2800 swift-test.log | tr '\n' '|')"
        else
          echo "::error title=swift test tail::swift-test.log missing - swift failed before producing output"
        fi

    - name: Compile Standalone Release App and DMG
      run: |
        chmod +x ./scripts/build.sh
        ./scripts/build.sh

    - name: Automatically Create Release and Upload DMG
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: PathDeck.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
