name: Swift CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "V*", "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Run Tests
      run: |
        set -o pipefail
        swift test --verbose 2>&1 | tee swift-test.log

    - name: Emit Failure Diagnostics
      if: failure()
      run: |
        if [ -f swift-test.log ]; then
          echo "::error title=swift test tail::$(tail -c 2800 swift-test.log | tr '\n' '|')"
        else
          echo "::error title=swift test tail::swift-test.log missing - swift failed before producing output"
        fi

    - name: Compile Standalone Release App and DMG
      run: |
        chmod +x ./scripts/build.sh
        ./scripts/build.sh

    - name: Automatically Create Release and Upload DMG
      if: startsWith(github.ref, 'refs/tags/V') || startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: PathDeck.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
